name: offline-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    # Run inside the official Python image so every version in the matrix is
    # available, whatever OS ubuntu-latest points to (Ubuntu 26.04 has no
    # Python 3.9 build for actions/setup-python). The minimum is 3.10 because
    # the pinned boto3==1.43.76 requires Python >= 3.10.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: pip install --no-cache-dir -r project/starter/requirements-dev.txt
      - name: Offline validator
        working-directory: project/starter
        run: python validate_offline.py
      - name: Unit tests
        run: python -m pytest project/tests -q
